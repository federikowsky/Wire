name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DUB_HOME: ${{ github.workspace }}/.ci-home

    steps:
      - uses: actions/checkout@v6

      - name: Capture runner context
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          uname -a | tee artifacts/ci/uname.txt
          lscpu | tee artifacts/ci/lscpu.txt
          free -h | tee artifacts/ci/memory.txt

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Capture toolchain
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          ldc2 --version 2>&1 | tee artifacts/ci/ldc.txt
          dub --version 2>&1 | tee artifacts/ci/dub.txt
          cc --version 2>&1 | tee artifacts/ci/cc.txt

      - name: Build libraries
        run: |
          set -o pipefail
          HOME="$DUB_HOME" dub build --compiler=ldc2 2>&1 | tee artifacts/ci/build-debug.log
          HOME="$DUB_HOME" dub build --compiler=ldc2 --build=release 2>&1 | tee artifacts/ci/build-release.log

      - name: Run repository tests
        run: |
          set -o pipefail
          make test 2>&1 | tee artifacts/ci/repository-tests.log

      - name: Link and run downstream consumer
        run: |
          set -o pipefail
          HOME="$DUB_HOME" dub run --root=tests/link-smoke --compiler=ldc2 --build=release 2>&1 | tee artifacts/ci/link-smoke.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire-linux-${{ github.sha }}
          path: artifacts/ci
          if-no-files-found: error
